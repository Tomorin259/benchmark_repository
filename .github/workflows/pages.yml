name: benchmark website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - evaluation/**
      - figures/**
      - methods/configurations.tsv
      - data/datasets.tsv
      - data/release_map.tsv
      - artifacts.tsv
      - tests/test_site_export.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify complete static visual bundle
        run: test -s site/public/visuals/index.json
      - name: Verify score and display contracts
        run: python -m unittest discover -s tests -p test_site_export.py -v
      - name: Build website
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
