name: repository checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check JSON files
        run: |
          python -m json.tool evaluation/cell/config.json >/dev/null
          python -m json.tool evaluation/cell/reference_neighbors/manifest.json >/dev/null
          python -m json.tool evaluation/kinetics_recovery/config.json >/dev/null
          python -m json.tool evaluation/kinetics_recovery/plotting/figure6_config.json >/dev/null
          python -m json.tool evaluation/kinetics_recovery/plotting/stream_config.json >/dev/null
          python -m json.tool evaluation/kinetics_recovery/results/expanded_reference/manifest.json >/dev/null
      - name: Compile Python entry points
        run: >-
          python -m py_compile
          evaluation/cell/run_cell_metrics.py
          evaluation/cell/prepare_cell_metrics.py
          evaluation/cell/score_tivelo_metrics.py
          evaluation/cell/reference_neighbors.py
          evaluation/cell/plots.py
          evaluation/cell/build_reference_union_moments.py
          evaluation/cell/preflight_reference30_inputs.py
          evaluation/cell/metrics.py
          evaluation/cell/batc.py
          evaluation/cell/validate_results.py
          evaluation/kinetics_recovery/metrics.py
          evaluation/kinetics_recovery/expanded_reference.py
          evaluation/kinetics_recovery/plotting/expanded_reference.py
          evaluation/kinetics_recovery/plotting/figure6.py
          evaluation/kinetics_recovery/plotting/streams.py
          evaluation/gene/config.py
          evaluation/gene/plot_gene_assets.py
          evaluation/gene/plotting/phase_portrait.py
          evaluation/gene/simulation/generate.py
          evaluation/gene/simulation/make_truth_reference.py
          evaluation/gene/simulation/reference.py
          evaluation/summary/refresh_real_cbdir_summary.py
          evaluation/summary/refresh_sim_cbdir_summary.py
          supplement/multivelo/run_multivelo_controls.py
          supplement/multivelo/run_scvelo_controls.py
          supplement/multivelo/inspect_phase_rule.py
          tools/prepare_release.py
          tools/archive_multivelo_results.py
          tools/compare_figure6.py
          supplement/multivelo/summarize_controls.py
          supplement/multivelo/plot_materials.py
          figures/assembly/suppfig15/assemble_materials.py
          ensemble/core.py
          ensemble/geometric_median.py
          ensemble/metrics.py
          ensemble/benchmark.py
          ensemble/plot_supfig10.py
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy h5py anndata matplotlib matplotlib-venn scikit-learn seaborn pytest "setuptools<81" scvelo==0.3.4
      - name: Run tests
        run: python -m pytest tests -q
      - name: Validate real Gene summary
        run: python evaluation/summary/refresh_real_cbdir_summary.py
      - name: Check whitespace
        run: git diff --check
